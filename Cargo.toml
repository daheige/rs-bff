[package]
name = "rs-bff"
version = "0.1.3"
edition = "2024"

[dependencies]
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.33"

#tower = "0.5"
#tower-http = { version = "0.6", features = ["trace"] }

# logger
log = "0.4.33"
env_logger = { version = "0.11.11", features = ["color"] }
chrono = "0.4.45"

thiserror = "2.0.20"

# autometrics-rs 用于自动prometheus metrics服务可观测性
autometrics = { version = "3.0.0", features = ["prometheus-exporter"] }

# monitor
monitor = {git = "https://github.com/rs-god/hera", tag = "v1.2.4"}
shutdown = {git = "https://github.com/rs-god/hera", tag = "v1.2.4"}
hello-pb = {git = "https://github.com/daheige/hello-pb",tag ="v1.1.1"}

[build-dependencies]
tonic-prost-build = "0.14.6"
