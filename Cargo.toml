[package]
name = "rs-bff"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.14.6"
prost = "0.14.3"
tonic-prost = "0.14.6"
tokio = { version = "1.52.1", features = ["full"] }
async-trait = "0.1.89"
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.33"

#tower = "0.5"
#tower-http = { version = "0.6", features = ["trace"] }

# logger
log = "0.4.29"
env_logger = { version = "0.11.10", features = ["color"] }
chrono = "0.4.44"

thiserror = "2"

# monitor
monitor = {git = "https://github.com/rs-god/hera", tag = "v1.1.6"}
shutdown = {git = "https://github.com/rs-god/hera", tag = "v1.1.6"}
hello-pb = {git = "https://github.com/daheige/hello-pb",tag ="v1.0.5"}

[build-dependencies]
tonic-prost-build = "0.14.6"
